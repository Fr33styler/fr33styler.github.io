<!DOCTYPE html>
<head>
  <title>Fr33styler</title>
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../index.css">
  <script src="tasks.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon.png">
</head>
  <body>
    <dialog id="new-task" popover>
      <h1>Add a new task</h1>
      <br>
      <form id="task-form">
        <label for="task">Task: </label>
        <input type="text" id="task" name="task">
        <br><br>
        <label for="progress">Progress: </label>
        <input type="number" id="progress" min="0" max="100" value="0">
        <br><br>
        <label for="note">Note: </label>
        <input type="text" id="note" name="note">
        <br><br>
        <label for="date">Due: </label>
        <input type="date" id="date" name="date" value="2026-05-12">
        <input type="time" id="time" name="time" value="12:00">
        <br><br>
        <select id="priority">
          <option value="HIGH">High</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="LOW">Low</option>
        </select>
        <select id="status">
          <option value="finished">Finished</option>
          <option value="in-progress">In Progress</option>
          <option value="unfinished" selected>Unfinished</option>
        </select>
        <br><br>
        <button type="button" popovertarget="new-task" popovertargetaction="hide" onclick="addTaskFromForm()">Add Task</button>
        <button type="button" popovertarget="new-task" popovertargetaction="hide">Close</button>
      </form>
    </dialog>
    <dialog id="edit-task" popover>
      <h1>Edit a task!</h1>
      <br>
      <form id="edit-form">
        <label for="edit-progress">Progress: </label>
        <input type="number" id="edit-progress" min="0" max="100" value="0">
        <br><br>
        <select id="edit-status">
          <option value="finished">Finished</option>
          <option value="in-progress">In Progress</option>
          <option value="unfinished" selected>Unfinished</option>
        </select>
        <br><br>
        <button type="button" popovertarget="edit-task" popovertargetaction="hide" onclick="editTaskFromForm()">Edit Task</button>
        <button type="button" popovertarget="edit-task" popovertargetaction="hide">Close</button>
      </form>
    </dialog>
    <div class="navigator">
      <a href="../">Home</a>
      <div class="navigator-right">
        <a href="../about">About</a>
        <a href="../projects">Projects</a>
        <a href="../contact">Contact</a>
      </div>
    </div>
    <br>
    <div class="submenu">
      <a href="/account/">Welcome</a>
      <a class="active" href="tasks">Tasks</a>
      <a onclick="logOff(); return false;" href="../">Log Off</a>
    </div>
    <br>
    <div class="buttons">
      <button type="button" popovertarget="new-task">Add new task</button>
    </div>
    <div class="boxes" id="boxes"></div>
    <footer>Copyright © 2026. All Rights Reserved.</footer>
    <br><br>
  </body>
</html>
